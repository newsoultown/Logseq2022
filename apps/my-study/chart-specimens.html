<title>书房图表样张</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局：一张纸面样张，顶部切换三种自有配色；同一份内容套三种版式（框线心智图、立体圆球逻辑图、箭头流程）。 */
:root{
  --bg:#f5efe3; --paper:#fffdf8; --ink:#2a2723; --muted:#6e655a; --line:#d9cfbf;
  --c1:#3f6b55; --c2:#b07d2c; --c3:#a8432f; --c4:#3d5a73; --c5:#6f8f5a; --c6:#7a5638;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-serif:"Noto Serif SC","Songti SC","SimSun",serif;
  color-scheme:light;
}
[data-pal="ling"]{--bg:#f4f2fa;--paper:#fdfcff;--ink:#2c2843;--muted:#6d6889;--line:#d8d3ea;--c1:#7562cf;--c2:#4f86c6;--c3:#c4729e;--c4:#3f9e96;--c5:#9a7fd8;--c6:#d1955a}
[data-pal="mo"]{--bg:#f2efe9;--paper:#fdfbf8;--ink:#37332f;--muted:#706a63;--line:#dcd5cb;--c1:#6f8a78;--c2:#6f84a0;--c3:#b67f70;--c4:#a88f68;--c5:#8d7d9c;--c6:#7f9393}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.7;margin:0;transition:background .3s}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:32px 72px}
header h1{font-family:var(--f-serif);font-weight:900;font-size:clamp(1.8em,4.5vw,2.5em);margin:0 0 6px;line-height:1.25;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:42em}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 12px;margin-top:18px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.pals{display:flex;flex-wrap:wrap;gap:8px}
.pals button{font:inherit;font-weight:700;font-size:1em;padding:8px 18px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.pals button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.pals button:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.sw{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88em;color:var(--muted)}
.sw span{display:inline-flex;align-items:center;gap:6px}
.sw i{width:18px;height:18px;border-radius:50%;display:inline-block}
section{margin-top:40px;display:grid;gap:12px}
section>h2{font-family:var(--f-serif);font-size:1.45em;margin:0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
section>h2 small{font-family:var(--f-sans);font-size:.6em;font-weight:400;color:var(--muted)}
.card{background:var(--paper);border-radius:14px;padding:clamp(16px,3vw,32px);box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(0,0,0,.25);min-width:0}
.ttl{font-family:var(--f-serif);font-weight:900;font-size:1.5em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}

/* 心智图 */
.mm{position:relative}
.mm svg.w{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mm-g{position:relative;display:grid;grid-template-columns:1fr auto 1fr;gap:18px 40px;align-items:center}
.side{display:grid;gap:20px}
.br{display:flex;align-items:center;gap:28px}
.side.l .br{flex-direction:row-reverse}
.bn{flex:none;border:2.5px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--paper));color:color-mix(in srgb,var(--c) 70%,var(--ink));font-weight:700;font-size:1.15em;border-radius:12px;padding:8px 16px;white-space:nowrap}
.kids{display:grid;gap:8px}
.side.l .kids{justify-items:end}
.kid{border:1.6px solid color-mix(in srgb,var(--c) 70%,var(--paper));background:var(--paper);border-radius:8px;padding:3px 12px;font-size:1em;white-space:nowrap}
.hub{background:var(--ink);color:var(--paper);font-family:var(--f-serif);font-weight:900;font-size:1.5em;border-radius:16px;padding:16px 22px;text-align:center;line-height:1.3;border:3px double var(--paper);box-shadow:0 0 0 3px var(--ink)}

/* 逻辑图 */
.lg svg{display:block;width:100%;height:auto}

/* 流程 */
.fl{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.fs{display:grid;justify-items:center;gap:10px;text-align:center;min-width:0}
.rib{width:100%;height:84px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.1em;clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%,14% 50%);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 80%,#000));padding:0 16% 0 18%;line-height:1.3}
.fs:first-child .rib{clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%)}
.ico{width:58px;height:58px;border-radius:50%;background:var(--paper);border:2px solid var(--c);display:grid;place-items:center;margin-top:-4px}
.ico svg{width:32px;height:32px}
.fs p{margin:0;color:var(--muted);font-size:1em;line-height:1.5;padding:0 6px}
.key{margin:22px 0 0;padding:12px 18px;border-left:5px solid var(--c1);background:color-mix(in srgb,var(--c1) 10%,var(--paper));font-weight:700;font-size:1.12em}
.note{color:var(--muted);font-size:.92em}
.ill{display:grid;gap:10px}
.ill a{justify-self:start;background:var(--ink);color:var(--paper);text-decoration:none;border-radius:8px;padding:8px 14px;font-weight:700}

@media (max-width:820px){
  .mm-g{grid-template-columns:1fr;gap:16px}
  .hub{justify-self:start;order:-1}
  .side{gap:14px}
  .br,.side.l .br{flex-direction:column;align-items:flex-start;gap:8px}
  .side.l .kids{justify-items:start}
  .kids{padding-left:16px;border-left:2.5px solid color-mix(in srgb,var(--c) 50%,var(--paper));margin-left:14px}
  .mm svg.w{display:none}
  .fl{grid-template-columns:1fr;gap:8px}
  .fs{grid-template-columns:64px 1fr;justify-items:start;text-align:left;align-items:center;column-gap:12px}
  .rib,.fs:first-child .rib{grid-column:1/-1;height:54px;clip-path:polygon(0 0,100% 0,100% 72%,52% 100%,48% 100%,0 72%);padding:0 0 8px}
  .ico{margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="root">
<header>
  <h1>我们自己的配色 · 样张</h1>
  <p>同一份《破解情绪密码》书摘，套三种版式。点上方按钮切换配色，比较哪一种最顺眼。</p>
</header>
<div class="bar">
  <div class="pals" role="group" aria-label="配色">
    <button data-p="dong" aria-pressed="true">东方雅韵</button>
    <button data-p="ling" aria-pressed="false">灵境晶光</button>
    <button data-p="mo" aria-pressed="false">莫兰迪知性</button>
  </div>
  <div class="sw" id="sw"></div>
</div>

<section>
  <h2>一　框线心智图<small>每个分支一种外框颜色，子节点沿用同色</small></h2>
  <div class="card"><p class="ttl">《破解情绪密码》全书结构</p><p class="sub">六个分支，一眼看完全书</p><div class="mm" id="mm"></div></div>
</section>

<section>
  <h2>二　立体圆球逻辑图<small>版式取自参考图「神奇的逻辑图」</small></h2>
  <div class="card lg" id="lg"></div>
</section>

<section>
  <h2>三　箭头流程<small>版式取自参考图的渐层箭头</small></h2>
  <div class="card"><p class="ttl">情绪如何变成身体症状</p><p class="sub">第八章 · 核心因果链</p><div class="fl" id="fl"></div><p class="key">真正致病的，是长年累积的基础情绪。</p></div>
</section>

<section>
  <h2>四　手绘插画<small>两种画风依内容选用</small></h2>
  <div class="card ill"><p class="note" style="margin:0">手绘插画会用 AI 画「不带字」的线描图，再由程序把正确的中文排上去。目前这个工作环境挡住了 AI 图片的下载网址，等网络设定开放后，我会把插画直接放进这一区比较。</p></div>
</section>
</div>

<script>
(function(){
var PALS={dong:{n:["墨绿","赭金","朱砂","黛蓝","竹青","檀褐"]},ling:{n:["淡紫","雾蓝","珍珠粉","青碧","藤紫","晨金"]},mo:{n:["灰绿","灰蓝","陶土粉","燕麦","雾紫","青灰"]}};
var root=document.documentElement,cur="dong";
function cv(i){return getComputedStyle(root).getPropertyValue("--c"+i).trim();}
function swatches(){document.getElementById("sw").innerHTML=PALS[cur].n.map(function(n,i){return '<span><i style="background:var(--c'+(i+1)+')"></i>'+n+'</span>';}).join("");}

/* 心智图 */
var MM=[
  {t:"核心概念",k:["情绪诱发病","检查都正常","小事更致病"]},
  {t:"两层情绪",k:["表面情绪","基础情绪"]},
  {t:"身体翻译",k:["胃·结肠","肩颈·头痛","皮肤·呼吸"]},
  {t:"六种需求",k:["爱·安全感","认可·创造","新奇·自尊"]},
  {t:"成熟度",k:["逆境稳定","独立","懂得付出"]},
  {t:"打断链条",k:["补上需求","固定喘息","培养好情绪"]}];
function br(b,i){return '<div class="br" style="--c:var(--c'+(i+1)+')"><div class="bn">'+b.t+'</div><div class="kids">'+b.k.map(function(k){return '<div class="kid">'+k+'</div>';}).join("")+'</div></div>';}
function mm(){var el=document.getElementById("mm");
  el.innerHTML='<svg class="w" aria-hidden="true"></svg><div class="mm-g"><div class="side l">'+MM.slice(0,3).map(function(b,i){return br(b,i);}).join("")+'</div><div class="hub">破解<br>情绪密码</div><div class="side r">'+MM.slice(3).map(function(b,i){return br(b,i+3);}).join("")+'</div></div>';wires();}
function curve(x1,y1,x2,y2,c,w){var mx=(x1+x2)/2;return '<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round"/>';}
function wires(){var el=document.getElementById("mm"),sv=el.querySelector("svg.w");if(!sv||getComputedStyle(sv).display==="none")return;
  var B=el.getBoundingClientRect(),hub=el.querySelector(".hub").getBoundingClientRect(),h="";sv.setAttribute("viewBox","0 0 "+B.width+" "+B.height);
  el.querySelectorAll(".br").forEach(function(b,i){var left=i<3,c=cv(i+1),bn=b.querySelector(".bn").getBoundingClientRect();
    var hx=left?hub.left-B.left:hub.right-B.left,hy=hub.top+hub.height/2-B.top,bx=left?bn.right-B.left:bn.left-B.left,by=bn.top+bn.height/2-B.top;
    h+=curve(hx,hy,bx,by,c,2.6);
    b.querySelectorAll(".kid").forEach(function(k){var r=k.getBoundingClientRect(),sx=left?bn.left-B.left:bn.right-B.left,kx=left?r.right-B.left:r.left-B.left,ky=r.top+r.height/2-B.top;h+=curve(sx,by,kx,ky,c,1.6);});});
  sv.innerHTML=h;}

/* 逻辑图 */
function mix(h1,h2,t){var a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16),r=function(sh){var x=(a>>sh)&255,y=(b>>sh)&255;return Math.round(x*t+y*(1-t));};return "rgb("+r(16)+","+r(8)+","+r(0)+")";}
function sphere(id,x,y,r,ci,no,t,s,narrow){var c=cv(ci);
  return '<defs><radialGradient id="g'+id+'" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="'+mix(c,"#ffffff",.45)+'"/><stop offset=".55" stop-color="'+c+'"/><stop offset="1" stop-color="'+mix(c,"#000000",.7)+'"/></radialGradient></defs>'+
  '<circle cx="'+x+'" cy="'+y+'" r="'+(r+16)+'" fill="'+c+'" fill-opacity=".08" stroke="'+c+'" stroke-opacity=".35" stroke-dasharray="3 6"/>'+
  '<circle cx="'+x+'" cy="'+(y+10)+'" r="'+r+'" fill="#000" opacity=".12" filter="url(#blur)"/>'+
  '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#g'+id+')"/>'+
  '<ellipse cx="'+(x-r*.28)+'" cy="'+(y-r*.5)+'" rx="'+(r*.38)+'" ry="'+(r*.18)+'" fill="#fff" opacity=".28"/>'+
  '<text x="'+x+'" y="'+(y-r*.3)+'" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="900" font-size="'+(narrow?20:24)+'" fill="#fff">'+no+'</text>'+
  '<text x="'+x+'" y="'+(y+r*.12)+'" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-weight="700" font-size="'+(narrow?22:26)+'" fill="#fff">'+t+'</text>'+
  '<text x="'+x+'" y="'+(y+r*.45)+'" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="'+(narrow?17:18)+'" fill="#fff" fill-opacity=".92">'+s+'</text>';}
var lastN=null;
function lg(force){var el=document.getElementById("lg"),narrow=el.clientWidth<700;if(!force&&narrow===lastN)return;lastN=narrow;
  var s='<svg viewBox="0 0 '+(narrow?"420 640":"1000 560")+'" role="img" aria-label="情绪的三个要素"><defs><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter></defs>';
  var ink=getComputedStyle(root).getPropertyValue("--ink").trim(),mut=getComputedStyle(root).getPropertyValue("--muted").trim(),c1=cv(1);
  if(!narrow){
    s+='<text x="40" y="52" font-family="Noto Serif SC,serif" font-weight="900" font-size="30" fill="'+ink+'">情绪的三个要素</text><text x="40" y="86" font-family="Noto Sans SC,sans-serif" font-size="18" fill="'+mut+'">第一章 · 引自威廉·詹姆斯</text>';
    s+='<circle cx="380" cy="330" r="150" fill="'+c1+'" fill-opacity=".06"/><text x="380" y="342" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="900" font-size="34" fill="'+ink+'">情绪</text>';
    s+=sphere("a",380,190,92,1,"01","主观感受","心里的感觉");
    s+=sphere("b",250,410,92,2,"02","生理反应","身体的变化");
    s+=sphere("c",510,410,92,3,"03","行为倾向","想做的动作");
    s+='<path d="M640 330 H730" stroke="'+mut+'" stroke-width="2" stroke-dasharray="6 6"/><path d="M722 322 L734 330 L722 338" fill="none" stroke="'+mut+'" stroke-width="2"/>';
    s+='<rect x="750" y="250" width="210" height="160" rx="18" fill="'+c1+'" fill-opacity=".08" stroke="'+c1+'" stroke-width="2"/>';
    s+='<text x="855" y="305" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-weight="700" font-size="22" fill="'+ink+'">三者同时出现</text><text x="855" y="345" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-weight="700" font-size="22" fill="'+ink+'">才算一种情绪</text><text x="855" y="385" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="17" fill="'+mut+'">缺一个就不成立</text>';
  }else{
    s+='<text x="20" y="40" font-family="Noto Serif SC,serif" font-weight="900" font-size="28" fill="'+ink+'">情绪的三个要素</text><text x="20" y="72" font-family="Noto Sans SC,sans-serif" font-size="17" fill="'+mut+'">第一章 · 引自威廉·詹姆斯</text>';
    s+='<text x="210" y="290" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="900" font-size="28" fill="'+ink+'">情绪</text>';
    s+=sphere("a",210,170,80,1,"01","主观感受","心里的感觉",1);
    s+=sphere("b",105,360,80,2,"02","生理反应","身体的变化",1);
    s+=sphere("c",315,360,80,3,"03","行为倾向","想做的动作",1);
    s+='<rect x="30" y="490" width="360" height="120" rx="18" fill="'+c1+'" fill-opacity=".08" stroke="'+c1+'" stroke-width="2"/>';
    s+='<text x="210" y="540" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-weight="700" font-size="22" fill="'+ink+'">三者同时出现，才算一种情绪</text><text x="210" y="578" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="17" fill="'+mut+'">缺一个就不成立</text>';}
  el.innerHTML=s+'</svg>';}

/* 流程 */
var ICON={
  need:'<path d="M16 27 C6 20 3 14 5 9 C7 4 13 4 16 9 C19 4 25 4 27 9 C29 14 26 20 16 27Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 9 L14 14 L18 17 L15 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  ice:'<path d="M3 13 H29" stroke="currentColor" stroke-width="2"/><path d="M13 13 L16 7 L19 10 L21 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 13 L6 20 L11 28 L22 29 L27 21 L23 13" fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  sig:'<circle cx="16" cy="17" r="3" fill="currentColor"/><path d="M10 11 A8 8 0 0 0 10 23 M22 11 A8 8 0 0 1 22 23 M6 7 A13 13 0 0 0 6 27 M26 7 A13 13 0 0 1 26 27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  body:'<circle cx="16" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 30 V18 C9 13 12 11 16 11 C20 11 23 13 23 18 V30" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="20" r="3" fill="currentColor"/>',
  doc:'<rect x="7" y="5" width="18" height="24" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 13 L14 16 L20 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M14 21 C14 19 19 19 19 21.5 C19 23 17 23 17 25 M17 27.5 V28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'};
var FL=[["需求缺口","need","爱与安全感不足"],["基础情绪","ice","表面没事心里堵"],["神经内分泌","sig","身体拉响警报"],["身体部位","body","胃、肩颈先痛"],["慢性症状","doc","检查却都正常"]];
function fl(){document.getElementById("fl").innerHTML=FL.map(function(x,i){return '<div class="fs" style="--c:var(--c'+(i+1)+')"><div class="rib">'+x[0]+'</div><div class="ico" style="color:var(--c'+(i+1)+')"><svg viewBox="0 0 32 32" aria-hidden="true">'+ICON[x[1]]+'</svg></div><p>'+x[2]+'</p></div>';}).join("");}

function setPal(p){cur=p;if(p==="dong")root.removeAttribute("data-pal");else root.setAttribute("data-pal",p);
  document.querySelectorAll(".pals button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.p===p);});
  swatches();lg(true);wires();try{localStorage.setItem("pal",p);}catch(e){}}
document.querySelectorAll(".pals button").forEach(function(b){b.onclick=function(){setPal(b.dataset.p);};});
mm();fl();var saved=null;try{saved=localStorage.getItem("pal");}catch(e){}setPal(PALS[saved]?saved:"dong");
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){lg();wires();},120);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(wires);
})();
</script>
