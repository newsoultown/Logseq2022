<title>我的书房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* 布局：夜色沉浸。全屏场景 + 光线与景深，界面以暗玻璃浮在场景之上；阅读时只有一页被灯照亮的纸。 */
:root{
  --abyss:#151d1a;              /* 最深的夜 */
  --night:#1f2b26;              /* 夜空 */
  --moon:#e3c88f;               /* 月光金，唯一主强调 */
  --ember:#e8a85a;              /* 烛光（古堡） */
  --violet:#ad92ff;             /* 灵光（水晶洞窟） */
  --seal:#b8382c;               /* 朱印：研读本反向链接 */
  --text:#ebe5d5;
  --mist:rgba(235,229,213,.6);
  --line:rgba(235,229,213,.12);
  --glass:rgba(24,34,30,.78);
  --paper:#ece2cc;--ink:#2a2118;--ink-2:#7a6a55;
  --f-display:"Ma Shan Zheng","Noto Serif SC",serif;
  --f-body:"Noto Serif SC","Songti SC","STSong",serif;
  --f-latin:"Cinzel","Times New Roman",serif;
  --f-li:"Libian SC","LiSu","STLiti","SimLi","隶书","华文隶书","Ma Shan Zheng","Noto Serif SC",serif;
  --ease:cubic-bezier(.6,.05,.25,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--abyss);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:1.5px solid var(--moon);outline-offset:3px}
.screen{min-height:100%;padding-bottom:76px;position:relative}
.screen[hidden]{display:none!important}
.latin{font-family:var(--f-latin);letter-spacing:.32em;font-size:11px;text-transform:uppercase}

.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line)}
.btn{border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13px;letter-spacing:.06em;transition:background .2s,border-color .2s,color .2s}
.btn:hover{border-color:rgba(241,223,174,.5);color:var(--moon)}
.btn.gold{background:var(--moon);color:#1a1408;border-color:var(--moon);font-weight:600}
.btn.gold:hover{background:#fff0c8;color:#1a1408}
.topbar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px}
.topbar .sp{flex:1}
.wordmark{font-family:var(--f-display);font-size:26px;color:var(--moon);letter-spacing:.1em;text-shadow:0 0 18px rgba(241,223,174,.35)}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:2px;padding:5px;border-radius:999px}
.nav button{padding:8px 16px;border-radius:999px;font-size:13px;letter-spacing:.12em;color:var(--mist);transition:color .2s,background .2s;white-space:nowrap}
.nav button[aria-current="page"]{color:#1a1408;background:var(--moon)}
.nav button:not([aria-current]):hover{color:var(--text)}
@media (max-width:420px){.nav button{padding:8px 12px}}

/* ===== 开场 ===== */
.gate{position:fixed;inset:0;z-index:100;background:#030306;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gate[hidden]{display:none!important}
.g-stage{position:relative;width:min(440px,74vw);aspect-ratio:3/4;perspective:1400px;transition:transform 1.3s var(--ease),filter 1.3s var(--ease)}
.g-bloom{position:absolute;inset:-40%;background:radial-gradient(circle at 50% 58%,rgba(255,236,190,.95) 0%,rgba(241,200,120,.55) 14%,rgba(160,100,40,.18) 34%,transparent 58%);opacity:.06;transition:opacity 1.4s var(--ease)}
.g-plaque{position:absolute;left:50%;transform:translateX(-50%);top:-2%;padding:6px 26px;font-family:var(--f-display);font-size:clamp(20px,5vw,30px);letter-spacing:.3em;color:var(--moon);border:1px solid rgba(241,223,174,.45);background:linear-gradient(#1b120b,#0d0805);text-shadow:0 0 14px rgba(241,223,174,.5);white-space:nowrap;z-index:3}
.g-frame{position:absolute;left:4%;right:4%;top:12%;bottom:0;border:8px solid #140a07;border-bottom:0;box-shadow:0 0 0 1px rgba(241,223,174,.08)}
.g-gap{position:absolute;left:50%;top:12%;bottom:0;width:2px;transform:translateX(-50%);background:#ffe9b8;box-shadow:0 0 18px 4px rgba(255,220,150,.75),0 0 60px 12px rgba(255,200,120,.25);animation:gapPulse 2.4s ease-in-out infinite}
@keyframes gapPulse{50%{box-shadow:0 0 24px 6px rgba(255,220,150,.9),0 0 80px 18px rgba(255,200,120,.35)}}
.leaf{position:absolute;top:12%;bottom:0;width:46%;background:
  radial-gradient(circle,rgba(217,170,90,.55) 0 2.6px,transparent 3.4px) 0 0/22% 9%,
  linear-gradient(90deg,#1c0a07,#2c110c 45%,#1a0906);background-position:11% 5%,0 0;
  box-shadow:inset 0 0 40px rgba(0,0,0,.7);transition:transform 1.9s var(--ease)}
.leaf.l{left:4%;transform-origin:left center}
.leaf.r{right:4%;transform-origin:right center}
.leaf i{position:absolute;top:52%;width:22px;height:22px;border:2px solid rgba(217,170,90,.7);border-radius:50%}
.leaf.l i{right:12px}.leaf.r i{left:12px}
.gate.open .leaf.l{transform:rotateY(-108deg)}
.gate.open .leaf.r{transform:rotateY(108deg)}
.gate.open .g-bloom{opacity:1}
.gate.open .g-gap{opacity:0;transition:opacity .4s}
.gate.enter .g-stage{transform:scale(3.4);filter:blur(6px) brightness(1.6)}
.gate.enter{background:#f6e8c8;transition:background 1.1s .2s}
.g-line{position:absolute;left:16px;right:16px;bottom:12vh;text-align:center;color:var(--mist);font-size:14px;letter-spacing:.2em;transition:opacity .5s}
.gate.open .g-line{opacity:0}
.g-skip{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));padding:8px 18px;border-radius:999px;border:1px solid rgba(235,229,213,.25);color:var(--mist);font-size:13px;letter-spacing:.1em}
.gate.lite .leaf,.gate.lite .g-gap{display:none}
.gate.lite .g-bloom{opacity:.7}

/* ===== 中庭 ===== */
#s-court{padding-bottom:0}
.court-stage{position:relative;height:100svh;min-height:520px;overflow:hidden;background:var(--night)}
#courtCv{position:absolute;inset:0;width:100%;height:100%;transition:transform 1s var(--ease),filter 1s var(--ease)}
.court-stage.push #courtCv{filter:blur(8px) brightness(1.7)}
.court-stage.push .door,.court-stage.push .court-hint{opacity:0}
.door{position:absolute;z-index:4;display:block;transition:opacity .4s}
.door .lbl{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:14px;text-align:center;white-space:nowrap;pointer-events:none}
.door .lbl b{display:block;font-weight:600;font-size:clamp(12px,1.6vw,17px);letter-spacing:.2em;color:var(--text);text-shadow:0 2px 12px rgba(0,0,0,.9)}
.door .lbl small{display:block;font-family:var(--f-latin);font-size:9.5px;letter-spacing:.3em;color:var(--mist);margin-top:2px;text-transform:uppercase}
.door:hover .lbl b,.door:focus-visible .lbl b{color:var(--moon)}
.court-hint{position:absolute;left:0;right:0;top:calc(66px + env(safe-area-inset-top,0px));text-align:center;font-size:13px;letter-spacing:.2em;color:var(--mist);z-index:4;transition:opacity .4s}
.desk{position:relative;z-index:5;max-width:1080px;margin:-150px auto 0;padding:0 16px 110px;display:grid;grid-template-columns:1.1fr 1fr 1.2fr;gap:14px}
.desk-card{border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.desk-card h3{margin:0;color:var(--mist)}
.desk-card .big{font-size:20px;font-weight:600;letter-spacing:.04em}
.desk-card .q{font-size:18px;line-height:1.75;text-wrap:pretty}
.desk-card .meta{font-size:12.5px;color:var(--mist)}
.desk-card .row{margin-top:auto;padding-top:10px;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:780px){.desk{grid-template-columns:1fr;margin-top:-90px}}
@media (max-width:640px){.door .lbl small{display:none}}

/* ===== 书房 ===== */
.room{min-height:100svh;overflow:hidden;isolation:isolate}
.room-bg{position:absolute;inset:0;z-index:-2}
.room .fx{position:absolute;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}
.room-head{padding:calc(78px + env(safe-area-inset-top,0px)) 20px 10px;max-width:1120px;margin:0 auto;text-align:center}
.room-head h1{margin:6px 0 4px;font-weight:900;font-size:clamp(30px,6vw,56px);letter-spacing:.14em;text-wrap:balance;line-height:1.15}
.room-head .sub{font-size:13px;color:var(--mist);letter-spacing:.14em}
.seals{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 18px;margin:26px auto 6px;max-width:900px;padding:0 16px}
.seals button{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mist);font-size:12.5px;letter-spacing:.16em;transition:color .2s}
.seals button span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;border:1px solid var(--line);transition:all .3s}
.seals button[aria-pressed="true"]{color:var(--text)}
.seals button[aria-pressed="true"] span{border-color:var(--room-accent);color:var(--room-accent);box-shadow:0 0 22px -2px var(--room-accent),inset 0 0 12px -4px var(--room-accent)}
.shelf-stage{perspective:1400px;max-width:820px;margin:16px auto 0;padding:0 16px}
.shelf-wrap{position:relative;transform-origin:50% 100%;transition:transform .45s var(--ease),opacity .45s}
.shelf-wrap.flip{transform:rotateX(-80deg);opacity:0}
.bgrow{display:flex;gap:4px;height:120px;align-items:flex-end;padding:0 30px;filter:blur(4px);opacity:.32;overflow:hidden;margin-bottom:-4px}
.bgrow i{flex:none;border-radius:2px}
.bgboard{height:10px;filter:blur(3px);opacity:.4;margin:0 10px 26px}
.shelf{position:relative;border-radius:4px;padding:30px 28px 0;background:var(--shelf-back);box-shadow:inset 0 30px 60px rgba(0,0,0,.55),inset 0 -10px 30px rgba(0,0,0,.4)}
.shelf::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% -20%,var(--room-light),transparent 60%);pointer-events:none;border-radius:4px}
.books{position:relative;display:flex;align-items:flex-end;justify-content:safe center;gap:5px;min-height:270px;overflow-x:auto;overflow-y:hidden;padding-top:30px;scrollbar-width:none}
.books::-webkit-scrollbar{display:none}
.board{position:relative;height:22px;margin:0 -28px;background:var(--board);box-shadow:0 18px 30px rgba(0,0,0,.6);border-radius:0 0 4px 4px}
.board::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,240,210,.25)}
.spine{position:relative;flex:none;width:var(--w);height:var(--h);border-radius:2px 3px 1px 1px;
  background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0) 16%,rgba(255,255,255,.13) 42%,rgba(0,0,0,0) 68%,rgba(0,0,0,.6)),var(--c);
  box-shadow:0 10px 16px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.3);
  transition:transform .35s var(--ease),box-shadow .35s;transform:rotate(var(--lean,0deg));transform-origin:bottom left}
.spine::before,.spine::after{content:"";position:absolute;left:3px;right:3px;height:5px;border-top:1px solid var(--gilt);border-bottom:1px solid var(--gilt);opacity:.75}
.spine::before{top:9%}.spine::after{bottom:8%}
.spine .tt{position:absolute;left:0;right:0;top:17%;bottom:16%;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:upright;font-size:15px;font-weight:600;letter-spacing:.16em;color:var(--gilt);text-shadow:0 1px 1px rgba(0,0,0,.6);overflow:hidden}
.spine:hover,.spine:focus-visible{transform:translateY(-16px) rotate(0deg);box-shadow:0 26px 30px rgba(0,0,0,.6),0 0 30px -6px var(--room-accent)}
.slot{flex:none;width:64px;height:180px;margin-left:14px;border:1px dashed rgba(235,229,213,.28);border-radius:3px;color:var(--mist);font-size:12px;letter-spacing:.1em;display:grid;place-items:center;text-align:center;line-height:1.7}
.slot:hover{border-color:var(--room-accent);color:var(--room-accent)}
.room-foot{text-align:center;color:var(--mist);font-size:12px;letter-spacing:.08em;padding:26px 16px 100px}
.room-tools{display:flex;justify-content:center;gap:10px;margin-top:22px}
.r-alex{--room-accent:#a9c6ff;--room-light:rgba(170,200,255,.22);--shelf-back:linear-gradient(#1b2338,#131a2b);--board:linear-gradient(#cdbf9f,#8e7f62)}
.r-alex .room-bg{background:
  radial-gradient(ellipse at 50% -10%,rgba(170,200,255,.30),transparent 55%),
  repeating-linear-gradient(90deg,transparent 0 6%,rgba(200,215,255,.05) 6% 7.5%,transparent 7.5% 12%),
  linear-gradient(#0a1022,#060914)}
.r-alex .room-head h1{color:#e8eeff;text-shadow:0 0 40px rgba(170,200,255,.35)}
.r-castle{--room-accent:#f0b56a;--room-light:rgba(240,170,90,.26);--shelf-back:linear-gradient(#22160e,#160e09);--board:linear-gradient(#6b4527,#3b2414)}
.r-castle .room-bg{background:
  radial-gradient(circle at 12% 18%,rgba(240,170,90,.35),transparent 30%),
  radial-gradient(circle at 88% 22%,rgba(240,170,90,.22),transparent 28%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 38px,transparent 38px 40px),
  linear-gradient(#140d09,#080504)}
.r-castle .room-head h1{color:#f6dcae;text-shadow:0 0 40px rgba(240,170,90,.4)}
.r-crystal{--room-accent:#c4adff;--room-light:rgba(190,160,255,.30);--shelf-back:linear-gradient(rgba(60,40,120,.45),rgba(25,15,55,.6));--board:linear-gradient(90deg,rgba(150,220,255,.5),rgba(200,170,255,.75),rgba(150,220,255,.5))}
.r-crystal .room-bg{background:
  radial-gradient(ellipse at 50% 0%,rgba(150,110,255,.38),transparent 55%),
  radial-gradient(ellipse at 0% 100%,rgba(90,200,255,.18),transparent 40%),
  radial-gradient(ellipse at 100% 100%,rgba(190,120,255,.2),transparent 40%),
  linear-gradient(#160f33,#07051a)}
.r-crystal .room-head h1{color:#efe6ff;text-shadow:0 0 30px rgba(190,160,255,.7)}
.r-crystal .board{box-shadow:0 0 30px rgba(190,160,255,.45),0 18px 30px rgba(0,0,0,.5)}
.r-crystal .spine:hover{box-shadow:0 26px 30px rgba(0,0,0,.6),0 0 40px rgba(190,160,255,.7)}
.crys{position:absolute;bottom:0;pointer-events:none;background:linear-gradient(180deg,rgba(225,210,255,.6),rgba(120,90,230,.08));clip-path:polygon(50% 0,100% 28%,82% 100%,18% 100%,0 28%);filter:drop-shadow(0 0 12px rgba(190,160,255,.6))}

.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,3,8,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal[hidden]{display:none!important}
.modal-card{width:min(640px,100%);max-height:88vh;overflow:auto;border-radius:20px;padding:26px}
.bk{display:flex;gap:26px;align-items:center}
.cover3d{flex:none;perspective:900px}
.cover{width:132px;aspect-ratio:3/4.3;position:relative;transform:rotateY(-24deg);transform-style:preserve-3d;animation:pullOut .6s var(--ease);
  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.12),transparent 60%),var(--c);border-radius:2px 6px 6px 2px;box-shadow:18px 22px 40px rgba(0,0,0,.6)}
.cover::before{content:"";position:absolute;inset:9px;border:1px solid var(--gilt);outline:1px solid var(--gilt);outline-offset:-5px;opacity:.7}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(90deg,rgba(0,0,0,.45),transparent)}
.cover b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;color:var(--gilt);font-size:22px;letter-spacing:.3em;font-weight:900}
@keyframes pullOut{from{transform:translateY(40px) rotateY(-70deg);opacity:0}}
.bk h2{margin:0;font-size:26px;letter-spacing:.08em}
.bk .who{color:var(--mist);font-size:13px;margin:2px 0 12px;letter-spacing:.06em}
.bk p{margin:0;line-height:1.85;text-wrap:pretty}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
@media (max-width:520px){.bk{flex-direction:column;align-items:flex-start}.cover{width:110px}}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label,.flabel{font-size:12.5px;color:var(--mist);letter-spacing:.1em}
select,input[type=text],textarea{background:rgba(0,0,0,.35);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;width:100%}
textarea{min-height:76px;resize:vertical}
.modal h2.t{margin:0 0 4px;font-size:22px;letter-spacing:.08em}
.modal .sub{color:var(--mist);font-size:13px;margin-bottom:12px}

/* ===== 阅读器 ===== */
.reader{background:radial-gradient(ellipse at 50% -8%,rgba(232,168,90,.24),transparent 50%),radial-gradient(ellipse at 50% 120%,rgba(60,50,110,.3),transparent 50%),#0a0910}
.reader.p-green{--paper:#dbe4cf;--ink:#22301f;--ink-2:#5e6f57}
.reader.p-night{--paper:#1b1914;--ink:#d8cfbc;--ink-2:#8f8573}
.r-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-width:0 0 1px}
.r-bar .t{flex:1;text-align:center;font-weight:600;letter-spacing:.12em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-bar .t small{display:block;font-weight:400;color:var(--mist);font-size:11.5px;letter-spacing:.1em;overflow:hidden;text-overflow:ellipsis}
.aa{position:absolute;right:0;top:calc(100% + 10px);width:min(300px,calc(100vw - 24px));border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;z-index:25}
.aa[hidden]{display:none!important}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;padding:6px 8px;border-radius:999px;font-size:13px;color:var(--mist);letter-spacing:.06em}
.seg button[aria-pressed="true"]{background:var(--moon);color:#1a1408}
.r-layout{display:flex;justify-content:center;gap:28px;padding:30px 16px 120px;align-items:flex-start}
.sheet-paper{position:relative;width:min(44em,100%);background:
  radial-gradient(ellipse at 50% 0%,rgba(255,250,235,.5),transparent 60%),var(--paper);color:var(--ink);
  border-radius:3px;padding:56px clamp(30px,6vw,72px) 64px;box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.2);min-width:0}
.reader.p-night .sheet-paper{background:var(--paper);box-shadow:0 40px 90px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05)}
.sheet-paper h2{margin:0;text-align:center;font-size:1.25em;letter-spacing:.24em;font-weight:900}
.sheet-paper .from{text-align:center;color:var(--ink-2);font-size:.72em;letter-spacing:.2em;margin:8px 0 34px}
.hint-line{font-size:.66em;color:var(--ink-2);text-align:center;letter-spacing:.06em;margin:-22px 0 30px;opacity:.85;line-height:1.8}
.para{position:relative;margin:0 -10px 1.15em;padding:4px 10px;border-radius:4px;transition:background .3s;cursor:pointer}
.para:hover{background:rgba(120,90,40,.05)}
.para.active{background:rgba(217,166,72,.15)}
.reader.p-night .para.active{background:rgba(241,223,174,.08)}
.para .num{position:absolute;left:-24px;top:10px;font-size:.6em;color:var(--ink-2);opacity:.6}
.ptext{line-height:2.15;text-align:justify;letter-spacing:.02em}
.term{border-bottom:1.5px dotted rgba(122,106,85,.85);cursor:help}
.reader.p-night .term{border-bottom-color:rgba(200,190,170,.6)}
.clip{background-image:linear-gradient(var(--seal),var(--seal));background-size:100% 1.5px;background-repeat:no-repeat;background-position:0 100%}
.mode-pure .clip{background-image:none}
mark{border-radius:2px;padding:0 1px;color:inherit;cursor:pointer}
mark.c-yellow{background:rgba(236,190,60,.42)}
mark.c-blue{background:rgba(100,150,220,.36)}
mark.c-red{background:rgba(210,80,65,.32)}
mark.c-green{background:rgba(100,175,115,.38)}
.reader.p-night mark{color:#f3ead6}
.seal{position:absolute;right:-30px;top:8px;width:20px;height:20px;border-radius:2px;background:var(--seal);color:#f6e6d6;font-size:11px;font-weight:600;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.seal:hover{filter:brightness(1.15)}

.seal.sealn{background:#5f6f4a}

.ptext{line-height:var(--plh,2)!important}

.infog:has(.kcs-slot){padding:0;border:none;background:none}.infog .kcs{border-radius:12px}.infog:has(.kcs-slot) figcaption{padding:0 6px}.ct-prev:has(.kcs-slot){padding:0;background:none}.ig-take{margin:12px 0 0;padding:8px 12px;border-left:4px solid #8a5a2a;background:rgba(138,90,42,.08);font-weight:700}

<script>
/* ---- 知识图表工坊引擎（与 skill 同一份 assets/engine.js） ---- */
/* 知识图表工坊 · 出图引擎
 * 用法：KCS.render(元素, spec)。spec 是一份 JSON，格式见 references/charts.md。
 * 支持类型：mindmap logic flow cycle compare timeline matrix pyramid cards radial illus
 * 配色：mo（莫兰迪知性，预设）、ling（灵境晶光）。
 * 版面会依容器宽度自动切换：宽 ≥ 700px 用横式，窄的用直式（手机）。
 */
(function (root) {
  "use strict";

  var PAL = {
    mo:   { name: "莫兰迪知性", bg: "#f2efe9", paper: "#fdfbf8", ink: "#37332f", muted: "#6b655e", line: "#dcd5cb",
            c: ["#6f8a78", "#6f84a0", "#b67f70", "#a88f68", "#8d7d9c", "#7f9393"],
            n: ["灰绿", "灰蓝", "陶土粉", "燕麦", "雾紫", "青灰"] },
    ling: { name: "灵境晶光", bg: "#f4f2fa", paper: "#fdfcff", ink: "#2c2843", muted: "#67628a", line: "#d8d3ea",
            c: ["#7562cf", "#4f86c6", "#c4729e", "#3f9e96", "#9a7fd8", "#d1955a"],

 zhuangzi:{t:"庄子",a:"庄周 · 战国",c:"#24443d",g:"#e2c886",intro:"道家经典。以寓言说理，《逍遥游》讲从拘束中解放，达到无待的自由。",ch:"逍遥游",p:[
  {t:"北冥有鱼，其名为鲲。鲲之大，不知其几千里也。化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。",bai:"北方的大海里有一条鱼，名叫鲲。鲲大到不知有几千里。它变成鸟，名叫鹏。鹏的背也不知有几千里；奋起而飞时，翅膀像垂挂在天边的云。",n:[["北冥","北方的大海。冥，通「溟」。"],["鲲","传说中的大鱼。"],["怒","奋发的样子。"]]},
  {t:"是鸟也，海运则将徙于南冥。南冥者，天池也。",bai:"这只鸟在海水翻动、起大风时，就要迁往南方的大海。南方的大海，就是天然的大池。",n:[["海运","海水运动，指起大风。"],["天池","天然形成的大池。"]]},

 daode:{t:"道德经",a:"老子 · 春秋",c:"#2e2847",g:"#e8d39a",intro:"道家根本经典，共八十一章。此处收第一章与第八章。",ch:"第一章 · 第八章",p:[
  {t:"道可道，非常道；名可名，非常名。无名天地之始；有名万物之母。",bai:"能说得出来的道，就不是恒常的道；能叫得出来的名，就不是恒常的名。无名是天地的开端，有名是万物的根源。",n:[["常","恒常、永久不变。"]]},
  {t:"故常无欲，以观其妙；常有欲，以观其徼。此两者，同出而异名，同谓之玄。玄之又玄，众妙之门。",bai:"所以常保无欲，用来观照道的奥妙；常保有欲，用来观照道的边际。两者同出一源而名称不同，都可以说是幽深。幽深再幽深，是一切奥妙的门户。",n:[["徼","边际、归结之处。"],["玄","幽深难测。"]]},
  {t:"上善若水。水善利万物而不争，处众人之所恶，故几于道。",bai:"最高的善像水一样。水善于滋养万物而不争，停留在众人不喜欢的低处，所以最接近道。",n:[["几","接近。"]]},

  {t:"如是我闻：一时，佛在舍卫国祇树给孤独园，与大比丘众千二百五十人俱。",bai:"我是这样听说的：有一次，佛在舍卫国的祇树给孤独园，与一千二百五十位大比丘在一起。",n:[["如是我闻","佛经开头常用语，表示由阿难亲闻佛说。"],["比丘","出家受具足戒的男众。"]]},
  {t:"凡所有相，皆是虚妄。若见诸相非相，则见如来。",bai:"一切有形有相的事物，都是虚妄不实的。如果能看见各种相并非真实的相，就见到了如来。",n:[["相","事物显现于外的形相。"],["如来","佛的称号，意为乘真如之道而来。"]]},

 baiyu:{t:"百喻经",a:"求那毘地 译 · 萧齐",c:"#6a2f24",g:"#efd6b0",intro:"以九十八则短小寓言讲佛理，故事浅白有趣。",ch:"愚人食盐喻",p:[
  {t:"昔有愚人，至于他家。主人与食，嫌淡无味。主人闻已，更为益盐。",bai:"从前有个愚人到别人家作客。主人请他吃饭，他嫌菜太淡没有味道。主人听了，就替他加了些盐。",n:[["益","增加。"]]},
  {t:"既得盐美，便自念言：「所以美者，缘有盐故。少有尚尔，况复多也？」",bai:"菜加了盐变得好吃，他心里想：之所以好吃，是因为有盐。加一点就这么好吃，多加不是更好吗？",n:[["尚尔","尚且如此。"]]},
  {t:"愚人无智，便空食盐。食已口爽，返为其患。",bai:"愚人没有智慧，就空口吃盐。吃完嘴巴失去味觉，反而成了祸患。",n:[["口爽","口舌败坏，尝不出味道。"]]}]},
 liezi:{t:"列子",a:"列御寇 · 战国",c:"#2f4a2c",g:"#e0e4bf",intro:"道家典籍，多寓言。《汤问》篇的愚公移山最为人熟知。",ch:"汤问 · 愚公移山",p:[
  {t:"太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。",bai:"太行、王屋两座山，方圆七百里，高达万丈，原本在冀州的南边、黄河北岸的北边。",n:[["仞","古代长度单位，约七八尺。"]]},
  {t:"北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：「吾与汝毕力平险，指通豫南，达于汉阴，可乎？」杂然相许。",bai:"北山有位愚公，年近九十，面对着山居住。他苦于山北交通阻塞，出入都要绕远路，就召集全家商量：我和你们尽全力铲平险峻的大山，让道路直通豫州南部，到达汉水南岸，好吗？大家纷纷赞同。",n:[["惩","苦于。"],["毕力","尽全力。"]]},
  {t:"河曲智叟笑而止之曰：「甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？」",bai:"河曲的智叟笑着劝阻他：你太不聪明了！凭你剩下的岁月和力气，连山上的一根草都毁不掉，又能把土石怎么样？",n:[["惠","同「慧」。"]]},
  {t:"北山愚公长息曰：「虽我之死，有子存焉；子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？」",bai:"北山愚公长叹道：即使我死了，还有儿子在；儿子又生孙子，孙子又生儿子，子子孙孙没有穷尽，可是山不会再增高，何愁挖不平呢？",n:[["匮","竭尽。"]]}]},
 shishuo:{t:"世说新语",a:"刘义庆 · 南朝宋",c:"#433322",g:"#ead7ad",intro:"记录汉末至东晋名士言行的笔记小说，文字简洁传神。",ch:"言语 · 咏雪",p:[
  {t:"谢太傅寒雪日内集，与儿女讲论文义。",bai:"谢安在一个寒冷的下雪天召集家人，和子侄们谈论诗文。",n:[["谢太傅","谢安，东晋名相。"],["内集","家庭聚会。"]]},
  {t:"俄而雪骤，公欣然曰：「白雪纷纷何所似？」兄子胡儿曰：「撒盐空中差可拟。」兄女曰：「未若柳絮因风起。」",bai:"不久雪下得很大，谢安高兴地问：这纷纷白雪像什么？侄子谢朗说：把盐撒在空中，差不多可以比拟。侄女谢道韫说：不如说是柳絮被风吹起。",n:[["差可拟","大致可以相比。"],["胡儿","谢朗的小名。"]]},
  {t:"公大笑乐。",bai:"谢安听了，开心地大笑。",n:[]}]},
 hanfei:{t:"韩非子",a:"韩非 · 战国",c:"#4d2424",g:"#ebcfa8",intro:"法家韩非书中的寓言，以小故事说明治理与思考的道理。",ch:"五蠹 · 守株待兔",p:[
  {t:"宋人有耕者，田中有株，兔走触株，折颈而死，因释其耒而守株，冀复得兔。",bai:"宋国有个种田的人，田里有个树桩。一只兔子奔跑时撞上树桩，折断脖子死了。他便放下农具守在树桩旁，希望再捡到兔子。",n:[["株","露出地面的树根。"],["耒","古代翻土的农具。"],["冀","希望。"]]},
  {t:"兔不可复得，而身为宋国笑。",bai:"兔子再也没捡到，他自己反而成了宋国人的笑柄。",n:[]}]},
 lvshi:{t:"吕氏春秋",a:"吕不韦 主编 · 战国",c:"#25374f",g:"#dbe3ee",intro:"杂家巨著，书中寓言短小精警。",ch:"察今 · 刻舟求剑",p:[
  {t:"楚人有涉江者，其剑自舟中坠于水，遽契其舟，曰：「是吾剑之所从坠。」",bai:"有个楚国人坐船过江，他的剑从船上掉进水里，他急忙在船边刻上记号，说：这是我的剑掉下去的地方。",n:[["涉","渡水。"],["遽","急忙。"],["契","刻。"]]},
  {t:"舟止，从其所契者入水求之。舟已行矣，而剑不行，求剑若此，不亦惑乎？",bai:"船停了，他从刻记号的地方下水找剑。船已经走了，剑却没有动，像这样找剑，不是很糊涂吗？",n:[["惑","糊涂。"]]}]},
 pocode:{"t": "破解情绪密码", "a": "约翰·A·辛德勒 · 刘杰 译", "c": "#5a2338", "g": "#f0cfd8", "intro": "心身医学经典（原名 How to Live 365 Days a Year）。核心：身体是情绪的翻译器，情绪成熟度是健康的隐藏变量。重点取自你 Notion 书摘参考库的深读摘要（原摘要读到第五章前段）。", "ch": "九个重点 · Notion 书摘", "src": "https://app.notion.com/p/3d3af2dae7b58106a58fe7b618398239", "p": [{"t": "情绪诱发病：很多查不出器质病变的身体不适，根源是长期不良情绪持续刺激神经系统与内分泌系统。书中引用当年统计，约七成以上就诊病人的主因是情绪诱发病。", "bai": "", "n": [["情绪诱发病", "EII，查不出器质病变、却真实难受的官能性疾病。"]]}, {"t": "身体是情绪的翻译器：颈后肌肉紧张、喉咙异物感、胃口时好时坏、结肠绞痛、偏头痛、皮肤炎，各有对应的情绪成因。", "bai": "", "n": [["翻译器", "作者的比喻：身体把说不出口的情绪「翻译」成症状。"]]}, {"t": "小事累积比大事更致病：羊实验显示，单调重复又没有喘息的刺激才会致病；每天有两小时中断，同样的刺激就不会。", "bai": "", "n": [["羊实验", "康奈尔大学的实验：同样的电击，加上预警与持续恐惧才让羊生病。"]]}, {"t": "表面情绪与基础情绪：表面情绪是脸上随时变化的反应；基础情绪深埋背景、可持续数年，真正致病的是基础情绪。", "bai": "", "n": [["表面情绪", "脸上看得到、随时变化的即时反应。"], ["基础情绪", "深埋背景、长期持续的底层情感基调。"]]}, {"t": "好情绪本身就是药：乐观与坚定的求生意志会影响脑下垂体与荷尔蒙平衡，实际改变身体状态。", "bai": "", "n": [["脑下垂体", "全身的「控制调节器」，分泌调控其他腺体的荷尔蒙。"]]}, {"t": "六种心理需求：爱、安全感、被认可、创造性、新奇体验、自尊。长期得不到满足，就会转成基础的不快情绪。", "bai": "", "n": []}, {"t": "成熟就是逆境中保持情绪稳定的能力。几乎没有人完全成熟；事业很强、生活却像孩子，是成熟度在不同领域发展不均衡。", "bai": "", "n": [["成熟", "作者的定义：面对变故时顾全局、不凭一时冲动行事。"]]}, {"t": "成熟的两大支柱是独立与付出。只知索取、过度争强好胜，都是不成熟的表现。", "bai": "", "n": []}, {"t": "咨询应用：先接住来询者的身体抱怨，再引导看向情绪层；建议安排「每天固定的喘息时段」，而不是要求消除压力源。", "bai": "", "n": []}]},
 wuliang:{"t": "无量之网", "a": "桂格·布莱登（Gregg Braden）", "c": "#2c2357", "g": "#d8ccff", "intro": "《The Divine Matrix》。主张宇宙中有一个能被意识与情绪影响的统一能量场，情绪是与它对话的语言。重点取自你 Notion 书摘参考库的深读摘要；书中科学主张属作者推论，并非公认结论。", "ch": "九个重点 · Notion 书摘", "src": "https://app.notion.com/p/3e4af2dae7b581b2b6a4ec38ca2d1280", "p": [{"t": "无量之网：宇宙中有一个无所不在、全像式、能被意识与情绪影响的统一能量场，它同时是容器、桥梁与镜子。", "bai": "", "n": [["无量之网", "作者对统一能量场的称呼，原文 The Divine Matrix。"]]}, {"t": "三个实验：DNA 魅影效应、军方 DNA 遥测、心数研究所情绪实验。作者据此主张 DNA 是天线，情绪是钥匙。", "bai": "", "n": [["DNA 魅影效应", "放入再移除 DNA 后，试管中的光子仍维持有序排列。"]]}, {"t": "观察即参与：双狭缝实验中，观察会改变电子的行为；物理学家惠勒主张把「观察者」改称「参与者」。", "bai": "", "n": [["双狭缝实验", "电子穿过两道狭缝时，有无观察者会改变它表现为波或粒子。"]]}, {"t": "感觉就是祈祷：只在语言上请求还不够，要先感觉目标已经达成；这份感觉必须不带自我、不带评判。", "bai": "", "n": []}, {"t": "全像式宇宙：每一部分都映照整体，「这里」与「那里」没有分别，祈祷升起的瞬间就已抵达对象。", "bai": "", "n": [["全像", "每一碎片都含有整体影像的结构。"]]}, {"t": "玛哈礼希效应：启动群体改变所需的最少人数，是总人口百分之一的平方根。", "bai": "", "n": [["玛哈礼希效应", "少数人共同静坐，周围地区暴力与意外统计下降的现象。"]]}, {"t": "三种核心恐惧：分离与抛弃、贬抑自我价值、屈服与信任。负面经验多半可追溯到其中之一。", "bai": "", "n": []}, {"t": "五道镜子：反映当下、反映评判、反映失落、反映灵魂暗夜、反映最伟大的慈悲，依序辨认人际关系映照出的信念。", "bai": "", "n": [["灵魂暗夜", "看似完美的状态突然瓦解，引导人直面此生最深的恐惧。"]]}, {"t": "咨询应用：最真实的信念反映在最亲密的关系中；结束时请来询者对辨认出的模式说一句不带评判的祝福。", "bai": "", "n": []}]},

function newSrc(src,oldT,newT){var d=diffMid(oldT,newT);
  if(d.om&&once(src,d.om))return {raw:src.replace(d.om,d.nm),d:d};
  if(!d.om){var an=oldT.slice(Math.max(0,d.p-6),d.p);if(an&&once(src,an)){var k=src.indexOf(an)+an.length;return {raw:src.slice(0,k)+d.nm+src.slice(k),d:d};}
    var hd=oldT.slice(0,6);if(d.p===0&&once(src,hd)){var k2=src.indexOf(hd);return {raw:src.slice(0,k2)+d.nm+src.slice(k2),d:d};}}
  var mk=(src.match(/^(#{1,6}\s|>\s?|[-*]\s|\d+\.\s)/)||[""])[0],sf=(src.match(/\s*\{[a-z]+="[^"]*"\}\s*$/)||[""])[0];
  return {raw:mk+newT.replace(/^• /,"")+sf,d:d,lossy:true};}

      createNote({text:old.slice(0,300),note:"改为："+nt.slice(0,300),book:R.book,p:i,s:0,e:0,c:"",nb:"",ch:"",kind:"原文修改"});
      rerender();activate(i,-1);toast(r.lossy?"已改好并同步 Notion（这段的粗体等格式已改成纯文字）":"原文已改好并同步 Notion，旧文字存进修改记录");
    }).catch(function(e){$("#edGo").disabled=false;toast("没有改到 Notion："+nErr(e));});};}

function mq(s){return String(s).replace(/[()\[\]{}"'`<>#;:|]/g," ").replace(/\s+/g," ").trim()||"·";}
function chartMarkdown(d,bk){var m="## "+d.title+"\n";
  if(d.type==="mindmap"){m+="```mermaid\nmindmap\n  root(("+mq(d.center)+"))\n"+d.branches.map(function(b){return "    "+mq(b.label)+"\n"+b.children.map(function(c){return "      "+mq(c);}).join("\n");}).join("\n")+"\n```\n";}
  else if(d.type==="flow"){m+="```mermaid\nflowchart TD\n"+d.steps.map(function(x,k){return '  S'+k+'["'+(k+1)+". "+mq(x.label)+'"]';}).join("\n")+"\n"+d.steps.slice(1).map(function(x,k){return "  S"+k+" --> S"+(k+1);}).join("\n")+"\n```\n"+d.steps.map(function(x,k){return (k+1)+". **"+x.label+"**："+x.desc;}).join("\n")+"\n";}
  else if(d.type==="table"){m+='<table header-row="true">\n<tr>\n'+d.columns.map(function(c){return "<td>"+esc(c)+"</td>";}).join("\n")+"\n</tr>\n"+d.rows.map(function(r){return "<tr>\n"+r.map(function(c){return "<td>"+esc(c)+"</td>";}).join("\n")+"\n</tr>";}).join("\n")+"\n</table>\n";}
  else if(d.type==="radial"){m+="```mermaid\nmindmap\n  root(("+mq(d.center)+"))\n"+d.items.map(function(x){return "    "+mq(typeof x==="string"?x:x.label);}).join("\n")+"\n```\n"+d.items.filter(function(x){return x&&x.desc;}).map(function(x){return "- **"+x.label+"**："+x.desc;}).join("\n")+"\n";}
  else if(d.type==="logic"){m+="**"+d.center+"**\n"+d.items.map(function(x,k){return (k+1)+". **"+x.title+"**"+(x.sub?"："+x.sub:"");}).join("\n")+"\n"+(d.note?"> "+String(d.note.title||"").replace(/\n/g,"")+(d.note.sub?"（"+d.note.sub+"）":"")+"\n":"");}
  else if(d.type==="cycle"){m+="```mermaid\nflowchart LR\n"+d.steps.map(function(x,k){return '  C'+k+'(["'+mq(x.label)+'"])';}).join("\n")+"\n"+d.steps.map(function(x,k){return "  C"+k+" --> C"+((k+1)%d.steps.length);}).join("\n")+"\n```\n"+d.steps.map(function(x,k){return (k+1)+". **"+x.label+"**："+x.desc;}).join("\n")+"\n";}
  else if(d.type==="timeline"){m+="```mermaid\ntimeline\n  title "+mq(d.title)+"\n"+d.events.map(function(x){return "  "+mq(x.time)+" : "+mq(x.label);}).join("\n")+"\n```\n"+d.events.map(function(x){return "- **"+x.time+"｜"+x.label+"**："+x.desc;}).join("\n")+"\n";}
  else if(d.type==="pyramid"){m+=d.levels.map(function(x,k){return (k+1)+". **"+x.label+"**"+(x.desc?"："+x.desc:"");}).join("\n")+"\n";}
  else if(d.type==="compare"){var mx=Math.max(d.left.points.length,d.right.points.length),rows=[];for(var r=0;r<mx;r++)rows.push("<tr>\n<td>"+esc(d.left.points[r]||"")+"</td>\n<td>"+esc(d.right.points[r]||"")+"</td>\n</tr>");
    m+='<table header-row="true">\n<tr>\n<td>'+esc(d.left.label)+"</td>\n<td>"+esc(d.right.label)+"</td>\n</tr>\n"+rows.join("\n")+"\n</table>\n";}
  else if(d.type==="matrix"){var qq=function(k){var q=d.quadrants[k];return "<td>**"+esc(q.label)+"**<br>"+q.items.map(esc).join("<br>")+"</td>";};
    m+="纵轴："+d.y+"（下→上）　横轴："+d.x+"（左→右）\n"+'<table>\n<tr>\n'+qq(0)+"\n"+qq(1)+"\n</tr>\n<tr>\n"+qq(2)+"\n"+qq(3)+"\n</tr>\n</table>\n";}
  else if(d.type==="illus"){if(d.intro)m+="*"+d.intro+"*\n";
    d.panels.forEach(function(q,k){m+="### "+(k+1)+". "+q.heading+(q.sub?"｜"+q.sub:"")+"\n**"+q.steps.map(function(x){return x.label;}).join(" → ")+"**\n"+q.steps.filter(function(x){return x.say;}).map(function(x){return "- "+x.label+"：「"+x.say+"」";}).join("\n")+"\n"+(q.caption?"> "+q.caption+"\n":"");});
    if(d.notes&&d.notes.length)m+=d.notes.map(function(n){return "- ✎ "+n;}).join("\n")+"\n";
    if(d.takeaway)m+="\n**💡 "+d.takeaway+"**\n";}
  else{m+=d.items.map(function(x){return "- **"+x.label+"**："+x.desc;}).join("\n")+"\n";}
  if(d.takeaway&&d.type!=="illus")m+="\n**💡 "+d.takeaway+"**\n";
  m+="\n来源：《"+(bk?bk.t:"")+"》"+(d.scope||"")+" · 由「我的书房」App 以知识图表工坊整理\n";return m;}
